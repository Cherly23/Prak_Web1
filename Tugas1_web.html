<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cherly Foodcourt</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 0; padding: 25px; }
        header { text-align: center; background-color: #f8f9fa; padding: 20px; border-bottom: 2px solid #ddd; }
        table { width: 80%; margin: 20px auto; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #798a09; color: white; }
        img { border-radius: 10px; object-fit: cover; }
        footer { text-align: center; margin-top: 50px; padding: 10px; font-size: 0.9em; color: #666; }
        .nav-link { text-align: center; margin: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>Selamat Datang di Cherly Foodcourt</h1>
        <img src="https://akcdn.detik.net.id/community/media/visual/2023/06/10/keren-food-court-di-new-york-ini-terinspirasi-kuliner-kaki-lima-singapura_169.webp?w=700&q=90" width="400" alt="Banner Foodcourt">
    </header>

    <div id="menu">
        <table border="1">
            <caption><h3>Daftar Menu Makanan & Minuman</h3></caption>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Nama Menu</th>
                    <th>Harga</th>
                    <th>Gambar</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Nasi Goreng Spesial</td>
                    <td>Rp 25.000</td>
                    <td><img src="https://www.dapurkobe.co.id/wp-content/uploads/nasi-goreng-kencur-kemangi.jpg" width="150" height="100"></td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Ayam Bakar Madu</td>
                    <td>Rp 30.000</td>
                    <td><img src="https://akcdn.detik.net.id/community/media/visual/2021/07/02/resep-ayam-bakar-kecap-madu-1_43.jpeg?w=700&q=90" width="150" height="100"></td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Es Teh Manis</td>
                    <td>Rp 5.000</td>
                    <td><img src="https://www.bakmigm.com/cfind/source/thumb/images/sku/cover_w480_h480_sku_teh-es.png" width="150" height="100"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <footer>
        <p>&copy; 2026 Copyright by Cherly - All Rights Reserved</p>
    </footer>

</body>
</html>
